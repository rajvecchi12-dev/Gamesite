<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Futebol de Botão Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #0a0e1a;
  --bg2: #111827;
  --card: #1a2235;
  --txt: #f0f4ff;
  --txt2: #8b9bc0;
  --red: #ef4444;
  --blue: #3b82f6;
  --green: #22c55e;
  --gold: #f59e0b;
  --purple: #a855f7;
  --r: 12px;
  --rs: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;height:100vh;width:100vw;-webkit-user-select:none;user-select:none}
h1,h2,h3{font-family:'Russo One',system-ui,sans-serif}
.screen{display:none;position:absolute;inset:0;justify-content:center;align-items:center;z-index:1}
.screen.active{display:flex}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:100}

/* Menu */
.menu-wrap{text-align:center;max-width:520px;width:92%}
.logo-icon{font-size:56px;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo h1{font-size:2rem;background:linear-gradient(135deg,var(--gold),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--txt2);font-size:.85rem;margin-top:2px;letter-spacing:3px;text-transform:uppercase}
.ranked-info{margin:20px 0;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.stat-box{background:var(--card);border-radius:var(--rs);padding:12px 20px;text-align:center;min-width:90px}
.stat-val{font-family:'Russo One',system-ui,sans-serif;font-size:1.3rem;display:block}
.stat-label{font-size:.7rem;color:var(--txt2)}
.coin-color{color:var(--gold)}
.rank-color{color:var(--purple)}
.menu-modes{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.mode-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;background:var(--card);border:2px solid transparent;border-radius:var(--r);color:var(--txt);cursor:pointer;transition:all .2s;font-family:inherit}
.mode-btn:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 6px 20px rgba(34,197,94,.12)}
.mode-btn .m-icon{font-size:1.6rem;width:40px;text-align:center}
.mode-btn .m-name{font-family:'Russo One',system-ui,sans-serif;font-size:1.1rem}
.mode-btn .m-desc{font-size:.75rem;color:var(--txt2)}
.menu-nav{display:flex;gap:10px;justify-content:center;margin-top:20px}
.btn{padding:12px 28px;border:none;border-radius:var(--rs);font-family:'Russo One',system-ui,sans-serif;font-size:.9rem;cursor:pointer;transition:all .15s}
.btn-g{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(34,197,94,.3)}
.btn-p{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff}
.btn-p:hover{transform:translateY(-2px)}
.btn-s{background:var(--card);color:var(--txt);border:1px solid #334155}
.btn-s:hover{background:#243044}
.btn-sm{padding:6px 14px;font-size:.8rem;background:var(--card);color:var(--txt);border:1px solid #334155;border-radius:var(--rs);cursor:pointer;font-family:inherit}

/* Shop */
.shop-wrap{max-width:560px;width:95%;max-height:90vh;overflow-y:auto}
.shop-wrap h2{text-align:center;margin-bottom:6px}
.shop-coins{text-align:center;color:var(--gold);font-family:'Russo One',system-ui,sans-serif;font-size:1.1rem;margin-bottom:16px}
.shop-section{margin-bottom:20px}
.shop-section h3{font-size:.9rem;color:var(--txt2);margin-bottom:10px;padding-left:4px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.shop-item{background:var(--card);border:2px solid transparent;border-radius:var(--rs);padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s}
.shop-item:hover{border-color:var(--gold)}
.shop-item.owned{border-color:var(--green);opacity:.85}
.shop-item.equipped{border-color:var(--gold);box-shadow:0 0 12px rgba(245,158,11,.3)}
.skin-preview{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;border:2px solid rgba(255,255,255,.15)}
.shop-item .item-name{font-size:.75rem;font-weight:600}
.shop-item .item-price{font-size:.7rem;color:var(--gold);margin-top:2px}
.shop-back{text-align:center;margin-top:16px;padding-bottom:12px}

/* Abilities */
.abilities-wrap{max-width:500px;width:95%;max-height:90vh;overflow-y:auto}
.abilities-wrap h2{text-align:center;margin-bottom:16px}
.ability-list{display:flex;flex-direction:column;gap:10px}
.ability-card{background:var(--card);border-radius:var(--rs);padding:14px 16px;display:flex;align-items:center;gap:14px;border:2px solid transparent}
.ability-card.unlocked{border-color:var(--green)}
.ability-card.locked{opacity:.5}
.ability-card.active{border-color:var(--gold);box-shadow:0 0 12px rgba(245,158,11,.2)}
.ab-icon{font-size:1.8rem;width:44px;text-align:center}
.ab-info{flex:1}
.ab-name{font-family:'Russo One',system-ui,sans-serif;font-size:.95rem}
.ab-desc{font-size:.7rem;color:var(--txt2);margin-top:2px}
.ab-req{font-size:.65rem;color:var(--purple);margin-top:2px}
.ab-equip{padding:6px 14px;font-size:.7rem;background:var(--green);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;font-family:'Russo One',system-ui,sans-serif}
.ab-equip.active-ab{background:var(--gold)}
.ab-equip:disabled{background:#334155;color:#666;cursor:default}
.abilities-back{text-align:center;margin-top:16px;padding-bottom:12px}

/* Game */
#game-screen{flex-direction:column}
.game-hud{width:100%;padding:2px 12px;display:flex;align-items:center;justify-content:center;gap:20px;height:40px}
.t-score{display:flex;align-items:center;gap:8px}
.t-name{font-family:'Russo One',system-ui,sans-serif;font-size:.8rem}
.t1 .t-name{color:var(--red)}.t2 .t-name{color:var(--blue)}
.t-num{font-family:'Russo One',system-ui,sans-serif;font-size:1.6rem}
.t1 .t-num{color:var(--red)}.t2 .t-num{color:var(--blue)}
.g-center{display:flex;flex-direction:column;align-items:center}
.g-timer{font-family:'Russo One',system-ui,sans-serif;font-size:1.1rem;color:var(--gold)}
.g-turn{font-size:.65rem;color:var(--txt2);padding:1px 10px;background:var(--card);border-radius:16px}
.canvas-area{flex:1;display:flex;justify-content:center;align-items:center;overflow:hidden;padding:2px}
#game-canvas{display:block;border-radius:6px;box-shadow:0 0 30px rgba(0,0,0,.5)}
.g-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.7);padding:6px 14px;border-radius:16px}
.g-bar-track{width:140px;height:10px;background:#333;border-radius:5px;overflow:hidden}
.g-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));border-radius:5px}
.g-controls{padding:2px 12px;display:flex;justify-content:center;gap:10px;height:32px;align-items:center}
.ability-btn{padding:4px 12px;font-size:.75rem;background:var(--purple);color:#fff;border:2px solid var(--purple);border-radius:var(--rs);cursor:pointer;font-family:'Russo One',system-ui,sans-serif;transition:all .15s}
.ability-btn:hover{box-shadow:0 0 10px rgba(168,85,247,.4)}
.ability-btn:disabled{background:#334155;border-color:#334155;color:#666;cursor:default}
.ability-btn.used{opacity:.4}

/* Goal */
.goal-text{text-align:center;animation:goalPop .5s ease-out}
@keyframes goalPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.goal-word{display:block;font-family:'Russo One',system-ui,sans-serif;font-size:4.5rem;background:linear-gradient(135deg,var(--gold),#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.goal-team{display:block;font-size:1.2rem;color:var(--txt2);margin-top:4px}

/* Game Over */
.go-wrap{text-align:center;max-width:420px;width:90%}
.go-wrap h2{font-size:2rem;margin-bottom:8px}
.go-result{font-family:'Russo One',system-ui,sans-serif;font-size:2.8rem;color:var(--gold);margin:16px 0}
.go-rewards{margin:16px 0 24px;display:flex;justify-content:center;gap:20px}
.go-reward{background:var(--card);border-radius:var(--rs);padding:10px 18px;text-align:center}
.go-reward .rv{font-family:'Russo One',system-ui,sans-serif;font-size:1.2rem;display:block}
.go-reward .rl{font-size:.7rem;color:var(--txt2)}
.go-btns{display:flex;gap:10px;justify-content:center}

@media(max-width:600px){
  .logo h1{font-size:1.5rem}
  .stat-box{padding:8px 14px;min-width:70px}.stat-val{font-size:1rem}
  .mode-btn{padding:12px 14px}.mode-btn .m-name{font-size:.95rem}
  .shop-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .goal-word{font-size:3rem}
  .g-timer{font-size:.9rem}.t-num{font-size:1.3rem}
}
  </style>
</head>
<body>
<div id="app">
  <!-- MENU -->
  <div id="menu-screen" class="screen active">
    <div class="menu-wrap">
      <div class="logo">
        <div class="logo-icon">⚽</div>
        <h1>Futebol de Botão</h1>
        <p class="subtitle">Ranked Arena</p>
      </div>
      <div class="ranked-info">
        <div class="stat-box"><span class="stat-val coin-color" id="menu-coins">0</span><span class="stat-label">Coins</span></div>
        <div class="stat-box"><span class="stat-val rank-color" id="menu-rank">Bronze</span><span class="stat-label">Rank</span></div>
        <div class="stat-box"><span class="stat-val" id="menu-rp">0</span><span class="stat-label">RP</span></div>
        <div class="stat-box"><span class="stat-val" id="menu-wins">0</span><span class="stat-label">Vitórias</span></div>
      </div>
      <div class="menu-modes">
        <button class="mode-btn" data-mode="1v1"><span class="m-icon">👤</span><span style="display:flex;flex-direction:column;align-items:flex-start"><span class="m-name">1 vs 1</span><span class="m-desc">1 botão por time</span></span></button>
        <button class="mode-btn" data-mode="2v2"><span class="m-icon">👥</span><span style="display:flex;flex-direction:column;align-items:flex-start"><span class="m-name">2 vs 2</span><span class="m-desc">5 botões por time</span></span></button>
        <button class="mode-btn" data-mode="3v3"><span class="m-icon">👥</span><span style="display:flex;flex-direction:column;align-items:flex-start"><span class="m-name">3 vs 3</span><span class="m-desc">7 botões por time</span></span></button>
      </div>
      <div class="menu-nav">
        <button class="btn btn-p" id="btn-shop">🛒 Loja</button>
        <button class="btn btn-s" id="btn-abilities">⚡ Habilidades</button>
      </div>
    </div>
  </div>

  <!-- SHOP -->
  <div id="shop-screen" class="screen">
    <div class="shop-wrap">
      <h2>🛒 Loja de Skins</h2>
      <div class="shop-coins">💰 <span id="shop-coins">0</span> Coins</div>
      <div id="shop-content"></div>
      <div class="shop-back"><button class="btn btn-s" id="btn-shop-back">Voltar</button></div>
    </div>
  </div>

  <!-- ABILITIES -->
  <div id="abilities-screen" class="screen">
    <div class="abilities-wrap">
      <h2>⚡ Habilidades Especiais</h2>
      <div class="ability-list" id="ability-list"></div>
      <div class="abilities-back"><button class="btn btn-s" id="btn-ab-back">Voltar</button></div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-screen" class="screen">
    <div class="game-hud">
      <div class="t-score t1"><span class="t-name" id="t1n">Você</span><span class="t-num" id="s1">0</span></div>
      <div class="g-center"><span class="g-timer" id="timer">03:00</span><span class="g-turn" id="turn">Sua vez</span></div>
      <div class="t-score t2"><span class="t-num" id="s2">0</span><span class="t-name" id="t2n">Bot</span></div>
    </div>
    <div class="canvas-area" style="position:relative">
      <canvas id="game-canvas"></canvas>
      <div class="g-bar" id="power-bar" style="display:none"><div class="g-bar-track"><div class="g-bar-fill" id="power-fill"></div></div><span style="font-size:.7rem;color:var(--txt2)">Força</span></div>
    </div>
    <div class="g-controls">
      <button class="ability-btn" id="btn-ability" disabled>⚡ Nenhuma</button>
      <button class="btn-sm" id="btn-quit-game">✕ Sair</button>
    </div>
  </div>

  <!-- GOAL -->
  <div id="goal-overlay" class="overlay" style="display:none"><div class="goal-text"><span class="goal-word">GOOOL!</span><span class="goal-team" id="goal-who"></span></div></div>

  <!-- GAME OVER -->
  <div id="go-screen" class="screen">
    <div class="go-wrap">
      <h2 id="go-title">Fim de Jogo!</h2>
      <div class="go-result" id="go-score">0 - 0</div>
      <div class="go-rewards">
        <div class="go-reward"><span class="rv coin-color" id="go-coins">+0</span><span class="rl">Coins</span></div>
        <div class="go-reward"><span class="rv rank-color" id="go-rp">+0</span><span class="rl">RP</span></div>
      </div>
      <div class="go-btns">
        <button class="btn btn-g" id="btn-again">Jogar Novamente</button>
        <button class="btn btn-s" id="btn-go-menu">Menu</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== SAVE DATA =====
const SAVE_KEY = 'fb_ranked_v2';
let save = loadSave();
function loadSave() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d && d.coins !== undefined) return d; } catch(e) {}
  return { coins: 0, rp: 0, wins: 0, losses: 0, skin: 'default', ownedSkins: ['default'], ability: null, ownedAbilities: [] };
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e) {} }

// ===== RANKS =====
const RANKS = [
  { name: 'Bronze', min: 0, color: '#cd7f32' },
  { name: 'Prata', min: 100, color: '#c0c0c0' },
  { name: 'Ouro', min: 300, color: '#ffd700' },
  { name: 'Diamante', min: 600, color: '#b9f2ff' },
  { name: 'Mestre', min: 1000, color: '#a855f7' },
  { name: 'Lenda', min: 1500, color: '#ef4444' },
];
function getRank(rp) { let r = RANKS[0]; for (const rank of RANKS) { if (rp >= rank.min) r = rank; } return r; }

// ===== SKINS =====
const SKINS = [
  { id: 'default', name: 'Clássico', c1: '#ef4444', c2: '#fff', price: 0 },
  { id: 'ocean', name: 'Oceano', c1: '#0ea5e9', c2: '#e0f2fe', price: 50 },
  { id: 'forest', name: 'Floresta', c1: '#16a34a', c2: '#dcfce7', price: 50 },
  { id: 'sunset', name: 'Pôr do Sol', c1: '#f97316', c2: '#fef3c7', price: 80 },
  { id: 'neon', name: 'Neon', c1: '#d946ef', c2: '#fae8ff', price: 100 },
  { id: 'gold', name: 'Dourado', c1: '#eab308', c2: '#fefce8', price: 150 },
  { id: 'shadow', name: 'Sombra', c1: '#1e293b', c2: '#475569', price: 120 },
  { id: 'ice', name: 'Gelo', c1: '#67e8f9', c2: '#fff', price: 100 },
  { id: 'fire', name: 'Fogo', c1: '#dc2626', c2: '#fbbf24', price: 200 },
  { id: 'galaxy', name: 'Galáxia', c1: '#6366f1', c2: '#c084fc', price: 250 },
  { id: 'emerald', name: 'Esmeralda', c1: '#059669', c2: '#6ee7b7', price: 180 },
  { id: 'chrome', name: 'Chrome', c1: '#94a3b8', c2: '#f1f5f9', price: 300 },
];
function getSkin(id) { return SKINS.find(s => s.id === id) || SKINS[0]; }

// ===== ABILITIES =====
const ABILITIES = [
  { id: 'power', name: 'Chute Potente', icon: '💥', desc: 'Próximo chute com 2x de força', rpReq: 0 },
  { id: 'speed', name: 'Velocidade', icon: '⚡', desc: 'Botão se move 50% mais rápido', rpReq: 100 },
  { id: 'curve', name: 'Chute Curvo', icon: '🌀', desc: 'A bola curva após o impacto', rpReq: 300 },
  { id: 'magnet', name: 'Magnetismo', icon: '🧲', desc: 'Bola é atraída levemente ao gol', rpReq: 600 },
  { id: 'freeze', name: 'Congelar', icon: '❄️', desc: 'Botões inimigos ficam parados 1 turno', rpReq: 1000 },
  { id: 'ghost', name: 'Fantasma', icon: '👻', desc: 'Seu botão atravessa os inimigos', rpReq: 1500 },
];

// ===== MODES =====
const MODES = { '1v1': { players: 1 }, '2v2': { players: 5 }, '3v3': { players: 7 } };

// ===== PHYSICS =====
class V2 {
  constructor(x=0,y=0){this.x=x;this.y=y}
  add(v){return new V2(this.x+v.x,this.y+v.y)}
  sub(v){return new V2(this.x-v.x,this.y-v.y)}
  sc(s){return new V2(this.x*s,this.y*s)}
  len(){return Math.hypot(this.x,this.y)}
  norm(){const l=this.len();return l>0?this.sc(1/l):new V2()}
  dot(v){return this.x*v.x+this.y*v.y}
  rot(a){const c=Math.cos(a),s=Math.sin(a);return new V2(this.x*c-this.y*s,this.x*s+this.y*c)}
}

class Body {
  constructor(x,y,r,m){this.pos=new V2(x,y);this.vel=new V2();this.r=r;this.m=m||1;this.fric=0.96;this.frozen=false}
  update(dt){if(this.frozen)return;this.pos=this.pos.add(this.vel.sc(dt));this.vel=this.vel.sc(this.fric);if(this.vel.len()<0.08)this.vel=new V2()}
  moving(){return this.vel.len()>0.08}
}

class Physics {
  constructor(w,h,gh){this.w=w;this.h=h;this.gh=gh;this.bodies=[];this.ball=null}
  add(b){this.bodies.push(b)}
  setBall(b){this.ball=b;this.add(b)}
  update(dt){
    for(const b of this.bodies)b.update(dt);
    for(let iter=0;iter<3;iter++){
      for(let i=0;i<this.bodies.length;i++)
        for(let j=i+1;j<this.bodies.length;j++)
          this.collide(this.bodies[i],this.bodies[j]);
    }
    this.walls();
  }
  collide(a,b){
    const d=b.pos.sub(a.pos),dist=d.len(),minD=a.r+b.r;
    if(dist>=minD||dist<0.01)return;
    const n=d.norm(),overlap=minD-dist,tm=a.m+b.m;
    const sepA=overlap*(b.m/tm)*1.05,sepB=overlap*(a.m/tm)*1.05;
    if(!a.frozen)a.pos=a.pos.sub(n.sc(sepA));
    if(!b.frozen)b.pos=b.pos.add(n.sc(sepB));
    const rv=a.vel.sub(b.vel).dot(n);
    if(rv>0)return;
    const e=0.55,imp=-(1+e)*rv/tm;
    if(!a.frozen)a.vel=a.vel.add(n.sc(imp*b.m));
    if(!b.frozen)b.vel=b.vel.sub(n.sc(imp*a.m));
  }
  walls(){
    const gT=(this.h-this.gh)/2,gB=gT+this.gh;
    for(const b of this.bodies){
      const isBall=b===this.ball;
      if(b.pos.x-b.r<0){if(!(isBall&&b.pos.y>gT&&b.pos.y<gB)){b.pos.x=b.r;b.vel.x=Math.abs(b.vel.x)*0.4}}
      if(b.pos.x+b.r>this.w){if(!(isBall&&b.pos.y>gT&&b.pos.y<gB)){b.pos.x=this.w-b.r;b.vel.x=-Math.abs(b.vel.x)*0.4}}
      if(b.pos.y-b.r<0){b.pos.y=b.r;b.vel.y=Math.abs(b.vel.y)*0.4}
      if(b.pos.y+b.r>this.h){b.pos.y=this.h-b.r;b.vel.y=-Math.abs(b.vel.y)*0.4}
      if(!isBall){
        const posts=[{x:0,y:gT},{x:0,y:gB},{x:this.w,y:gT},{x:this.w,y:gB}];
        for(const p of posts){const dd=b.pos.sub(new V2(p.x,p.y)),di=dd.len(),mn=b.r+5;
          if(di<mn&&di>0){const nn=dd.norm();b.pos=new V2(p.x,p.y).add(nn.sc(mn));const vn=b.vel.dot(nn);if(vn<0)b.vel=b.vel.sub(nn.sc(vn*1.3))}}
      }
    }
  }
  checkGoal(){
    if(!this.ball)return 0;
    const gT=(this.h-this.gh)/2,gB=gT+this.gh,b=this.ball;
    if(b.pos.x<-b.r&&b.pos.y>gT&&b.pos.y<gB)return 2;
    if(b.pos.x>this.w+b.r&&b.pos.y>gT&&b.pos.y<gB)return 1;
    return 0;
  }
  allStopped(){return this.bodies.every(b=>!b.moving())}
}

// ===== GAME =====
class Game {
  constructor(canvas,mode){
    this.cv=canvas;this.c=canvas.getContext('2d');this.mode=mode;
    this.np=MODES[mode].players;
    this.BR=24;this.BLR=12;this.GD=40;this.SF=8;
    this.score=[0,0];this.team=1;this.state='waiting';this.prev=null;
    this.sel=null;this.as=null;this.ae=null;this.power=0;
    this.timeLeft=180;this.lt=0;this.af=null;
    this.t1=[];this.t2=[];
    this.abilityUsed=false;this.curveActive=false;this.magnetActive=false;this.ghostActive=false;
    this.enemyFrozen=false;
    this.onGoal=null;this.onTime=null;this.onTurn=null;this.onEnd=null;
    this.playerSkin=getSkin(save.skin);
    this.botSkin={c1:'#3b82f6',c2:'#dbeafe'};
    this.resize();this.initPhys();this.setupPos();this.bind();
  }

  resize(){
    const wr=this.cv.parentElement,mW=wr.clientWidth-2,mH=wr.clientHeight-2;
    const asp=16/9;let w,h;
    if(mW/mH>asp){h=mH;w=h*asp}else{w=mW;h=w/asp}
    this.fw=Math.floor(w);this.fh=Math.floor(h);
    this.cv.width=this.fw;this.cv.height=this.fh;
    this.goalH=this.fh*0.32;
  }

  initPhys(){
    this.ph=new Physics(this.fw,this.fh,this.goalH);
    this.ball=new Body(this.fw/2,this.fh/2,this.BLR,0.3);
    this.ball.fric=0.97;
    this.ph.setBall(this.ball);
  }

  setupPos(){
    this.t1=[];this.t2=[];
    for(const p of this.getForm(1)){const b=new Body(p.x,p.y,this.BR,2);b.tm=1;this.t1.push(b);this.ph.add(b)}
    for(const p of this.getForm(2)){const b=new Body(p.x,p.y,this.BR,2);b.tm=2;this.t2.push(b);this.ph.add(b)}
  }

  getForm(t){
    const n=this.np,w=this.fw,h=this.fh,p=[];
    if(t===1){
      if(n===1){p.push({x:w*.25,y:h*.5})}
      else{p.push({x:w*.08,y:h*.5});
        if(n>=3){p.push({x:w*.2,y:h*.35});p.push({x:w*.2,y:h*.65})}
        if(n>=5){p.push({x:w*.35,y:h*.3});p.push({x:w*.35,y:h*.7})}
        if(n>=7){p.push({x:w*.45,y:h*.4});p.push({x:w*.45,y:h*.6})}}
    } else {
      if(n===1){p.push({x:w*.75,y:h*.5})}
      else{p.push({x:w*.92,y:h*.5});
        if(n>=3){p.push({x:w*.8,y:h*.35});p.push({x:w*.8,y:h*.65})}
        if(n>=5){p.push({x:w*.65,y:h*.3});p.push({x:w*.65,y:h*.7})}
        if(n>=7){p.push({x:w*.55,y:h*.4});p.push({x:w*.55,y:h*.6})}}
    }
    return p;
  }

  resetPos(){
    const p1=this.getForm(1),p2=this.getForm(2);
    this.t1.forEach((b,i)=>{b.pos=new V2(p1[i].x,p1[i].y);b.vel=new V2();b.frozen=false});
    this.t2.forEach((b,i)=>{b.pos=new V2(p2[i].x,p2[i].y);b.vel=new V2();b.frozen=false});
    this.ball.pos=new V2(this.fw/2,this.fh/2);this.ball.vel=new V2();
    this.curveActive=false;this.magnetActive=false;this.ghostActive=false;this.enemyFrozen=false;
  }

  bind(){
    this._md=e=>{this.onMD(e)};this._mm=e=>{this.onMM(e)};this._mu=()=>{this.onMU()};
    this._ts=e=>{e.preventDefault();const t=e.touches[0];this.onMD({clientX:t.clientX,clientY:t.clientY})};
    this._tm=e=>{e.preventDefault();const t=e.touches[0];this.onMM({clientX:t.clientX,clientY:t.clientY})};
    this._te=()=>{this.onMU()};
    this.cv.addEventListener('mousedown',this._md);this.cv.addEventListener('mousemove',this._mm);this.cv.addEventListener('mouseup',this._mu);
    this.cv.addEventListener('touchstart',this._ts,{passive:false});this.cv.addEventListener('touchmove',this._tm,{passive:false});this.cv.addEventListener('touchend',this._te);
  }
  unbind(){this.cv.removeEventListener('mousedown',this._md);this.cv.removeEventListener('mousemove',this._mm);this.cv.removeEventListener('mouseup',this._mu);this.cv.removeEventListener('touchstart',this._ts);this.cv.removeEventListener('touchmove',this._tm);this.cv.removeEventListener('touchend',this._te)}

  cp(e){const r=this.cv.getBoundingClientRect();return new V2((e.clientX-r.left)*(this.cv.width/r.width),(e.clientY-r.top)*(this.cv.height/r.height))}

  onMD(e){
    if(this.state!=='waiting'||this.team!==1)return;
    const pos=this.cp(e);
    for(const b of this.t1){if(pos.sub(b.pos).len()<b.r+12){this.sel=b;this.as=pos;this.ae=pos;this.state='aiming';return}}
  }
  onMM(e){if(this.state!=='aiming'||!this.sel)return;this.ae=this.cp(e);this.power=Math.min(this.as.sub(this.ae).len()/180,1)}
  onMU(){
    if(this.state!=='aiming'||!this.sel)return;
    const diff=this.as.sub(this.ae),force=Math.min(diff.len()/180,1)*this.SF;
    if(force>0.3){
      let mult=20;
      if(save.ability==='power'&&!this.abilityUsed){mult=40;this.abilityUsed=true}
      if(save.ability==='speed'&&!this.abilityUsed){mult=30;this.abilityUsed=true}
      if(save.ability==='curve'&&!this.abilityUsed){this.curveActive=true;this.abilityUsed=true}
      if(save.ability==='magnet'&&!this.abilityUsed){this.magnetActive=true;this.abilityUsed=true}
      if(save.ability==='ghost'&&!this.abilityUsed){this.ghostActive=true;this.abilityUsed=true}
      if(save.ability==='freeze'&&!this.abilityUsed){this.enemyFrozen=true;this.t2.forEach(b=>b.frozen=true);this.abilityUsed=true}
      this.sel.vel=diff.norm().sc(force*mult);
      this.state='animating';
    } else {this.state='waiting'}
    this.power=0;this.sel=null;this.as=null;this.ae=null;
  }

  botTurn(){
    if(this.state!=='waiting'||this.team!==2)return;
    setTimeout(()=>{
      if(this.state!=='waiting'||this.team!==2)return;
      const btns=this.t2.filter(b=>!b.frozen);
      if(btns.length===0){this.team=1;this.state='waiting';if(this.onTurn)this.onTurn(1);return}
      const btn=btns[Math.floor(Math.random()*btns.length)];
      const target=this.ball.pos;
      const dir=target.sub(btn.pos).norm();
      const force=(3+Math.random()*5)*20;
      btn.vel=dir.sc(force/20*this.SF*18);
      this.state='animating';
    },600+Math.random()*400);
  }

  start(){this.lt=performance.now();this.state='waiting';this.loop()}

  loop(){
    const now=performance.now(),dt=Math.min((now-this.lt)/1000,0.05);this.lt=now;
    if(this.state!=='paused'&&this.state!=='ended'&&this.state!=='goal'){
      this.timeLeft-=dt;
      if(this.timeLeft<=0){this.timeLeft=0;this.endGame();return}
      if(this.onTime)this.onTime(this.timeLeft);
    }
    if(this.state==='animating'){
      if(this.curveActive&&this.ball.moving()){this.ball.vel=this.ball.vel.rot(0.012)}
      if(this.magnetActive&&this.ball.moving()){
        const goalCenter=new V2(this.fw,this.fh/2);
        const toGoal=goalCenter.sub(this.ball.pos).norm();
        this.ball.vel=this.ball.vel.add(toGoal.sc(0.15));
      }
      this.ph.update(dt*30);
      const gs=this.ph.checkGoal();
      if(gs>0){
        this.score[gs-1]++;this.state='goal';
        if(this.onGoal)this.onGoal(gs,this.score);
        setTimeout(()=>{
          this.resetPos();this.abilityUsed=false;
          this.team=gs===1?2:1;this.state='waiting';
          if(this.onTurn)this.onTurn(this.team);
          if(this.team===2)this.botTurn();
        },2000);
      } else if(this.ph.allStopped()){
        this.curveActive=false;this.magnetActive=false;this.ghostActive=false;
        if(this.enemyFrozen){this.enemyFrozen=false;this.t2.forEach(b=>b.frozen=false)}
        this.team=this.team===1?2:1;this.state='waiting';
        if(this.onTurn)this.onTurn(this.team);
        if(this.team===2)this.botTurn();
      }
    }
    if(this.state==='waiting'&&this.team===2)this.botTurn();
    this.draw();
    this.af=requestAnimationFrame(()=>this.loop());
  }

  endGame(){this.state='ended';if(this.af)cancelAnimationFrame(this.af);if(this.onEnd)this.onEnd(this.score)}
  destroy(){this.state='ended';if(this.af)cancelAnimationFrame(this.af);this.unbind()}

  draw(){
    const c=this.c,w=this.fw,h=this.fh;
    c.fillStyle='#1a8c35';c.fillRect(0,0,w,h);
    const sw=w/14;for(let i=0;i<14;i++){if(i%2===0){c.fillStyle='rgba(0,0,0,0.03)';c.fillRect(i*sw,0,sw,h)}}
    const gT=(h-this.goalH)/2;
    c.fillStyle='rgba(255,255,255,0.08)';c.fillRect(-this.GD,gT,this.GD,this.goalH);c.fillRect(w,gT,this.GD,this.goalH);
    c.strokeStyle='rgba(255,255,255,0.12)';c.lineWidth=1;
    for(let y=gT;y<gT+this.goalH;y+=8){c.beginPath();c.moveTo(-this.GD,y);c.lineTo(0,y);c.stroke();c.beginPath();c.moveTo(w,y);c.lineTo(w+this.GD,y);c.stroke()}
    for(let x=-this.GD;x<=0;x+=8){c.beginPath();c.moveTo(x,gT);c.lineTo(x,gT+this.goalH);c.stroke()}
    for(let x=w;x<=w+this.GD;x+=8){c.beginPath();c.moveTo(x,gT);c.lineTo(x,gT+this.goalH);c.stroke()}
    c.strokeStyle='rgba(255,255,255,0.5)';c.lineWidth=2;c.strokeRect(1,1,w-2,h-2);
    c.beginPath();c.moveTo(w/2,0);c.lineTo(w/2,h);c.stroke();
    c.beginPath();c.arc(w/2,h/2,h*.16,0,Math.PI*2);c.stroke();
    c.fillStyle='rgba(255,255,255,0.5)';c.beginPath();c.arc(w/2,h/2,4,0,Math.PI*2);c.fill();
    const pW=w*.16,pH=h*.52,pT=(h-pH)/2;c.strokeRect(0,pT,pW,pH);c.strokeRect(w-pW,pT,pW,pH);
    const sW=w*.06,sH=h*.26,sT=(h-sH)/2;c.strokeRect(0,sT,sW,sH);c.strokeRect(w-sW,sT,sW,sH);
    c.fillStyle='#fff';c.fillRect(-2,gT-4,6,8);c.fillRect(-2,gT+this.goalH-4,6,8);c.fillRect(w-4,gT-4,6,8);c.fillRect(w-4,gT+this.goalH-4,6,8);

    this.drawBtns(c,this.t1,this.playerSkin,1);
    this.drawBtns(c,this.t2,this.botSkin,2);
    this.drawBall(c);

    if(this.state==='aiming'&&this.sel&&this.as&&this.ae)this.drawArrow(c);
    if(this.state==='waiting'&&this.team===1){
      const col='rgba(239,68,68,0.4)';
      for(const b of this.t1){c.beginPath();c.arc(b.pos.x,b.pos.y,b.r+6,0,Math.PI*2);c.strokeStyle=col;c.lineWidth=2;c.setLineDash([5,5]);c.stroke();c.setLineDash([])}
    }
  }

  drawBtns(c,btns,skin,tn){
    for(const b of btns){
      const x=b.pos.x,y=b.pos.y,r=b.r;
      if(b.frozen){c.globalAlpha=0.5}
      c.beginPath();c.arc(x+2,y+3,r,0,Math.PI*2);c.fillStyle='rgba(0,0,0,0.25)';c.fill();
      c.beginPath();c.arc(x,y,r,0,Math.PI*2);
      const g=c.createRadialGradient(x-4,y-4,0,x,y,r);g.addColorStop(0,skin.c1);g.addColorStop(1,this.dk(skin.c1,40));
      c.fillStyle=g;c.fill();
      c.beginPath();c.arc(x,y,r*.55,0,Math.PI*2);c.fillStyle=skin.c2;c.fill();
      c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.strokeStyle=tn===1?'rgba(239,68,68,0.7)':'rgba(59,130,246,0.7)';c.lineWidth=2.5;c.stroke();
      c.beginPath();c.arc(x-r*.25,y-r*.25,r*.3,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.18)';c.fill();
      if(b.frozen){c.globalAlpha=1;c.beginPath();c.arc(x,y,r+4,0,Math.PI*2);c.strokeStyle='rgba(103,232,249,0.6)';c.lineWidth=3;c.setLineDash([3,3]);c.stroke();c.setLineDash([])}
    }
  }

  drawBall(c){
    const x=this.ball.pos.x,y=this.ball.pos.y,r=this.ball.r;
    c.beginPath();c.arc(x+1,y+2,r,0,Math.PI*2);c.fillStyle='rgba(0,0,0,0.2)';c.fill();
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);
    const g=c.createRadialGradient(x-2,y-2,0,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#ccc');c.fillStyle=g;c.fill();
    c.strokeStyle='#444';c.lineWidth=.7;
    for(const a of [0,72,144,216,288]){const rad=a*Math.PI/180;c.beginPath();c.arc(x+Math.cos(rad)*r*.5,y+Math.sin(rad)*r*.5,r*.18,0,Math.PI*2);c.stroke()}
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.strokeStyle='#aaa';c.lineWidth=1;c.stroke();
  }

  drawArrow(c){
    const b=this.sel,diff=this.as.sub(this.ae),dir=diff.norm(),f=Math.min(diff.len()/180,1),al=f*120;
    const s=b.pos,e=s.add(dir.sc(al));
    c.beginPath();c.moveTo(s.x,s.y);c.lineTo(e.x,e.y);c.strokeStyle=`rgba(255,255,100,${.4+f*.6})`;c.lineWidth=3;c.stroke();
    const hl=14,an=Math.atan2(dir.y,dir.x);
    c.beginPath();c.moveTo(e.x,e.y);c.lineTo(e.x-hl*Math.cos(an-.4),e.y-hl*Math.sin(an-.4));c.lineTo(e.x-hl*Math.cos(an+.4),e.y-hl*Math.sin(an+.4));c.closePath();c.fillStyle=`rgba(255,255,100,${.4+f*.6})`;c.fill();
    c.beginPath();c.arc(b.pos.x,b.pos.y,b.r+7,0,Math.PI*2);c.strokeStyle='rgba(255,255,100,0.7)';c.lineWidth=3;c.stroke();
  }

  dk(hex,amt){let co=hex.replace('#','');if(co.length===3)co=co[0]+co[0]+co[1]+co[1]+co[2]+co[2];return`rgb(${Math.max(0,parseInt(co.substr(0,2),16)-amt)},${Math.max(0,parseInt(co.substr(2,2),16)-amt)},${Math.max(0,parseInt(co.substr(4,2),16)-amt)})`}
}

// ===== UI CONTROLLER =====
(()=>{
  let game=null,curMode='1v1';
  const $=id=>document.getElementById(id);

  function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
  function refreshMenu(){
    $('menu-coins').textContent=save.coins;
    $('menu-rank').textContent=getRank(save.rp).name;
    $('menu-rank').style.color=getRank(save.rp).color;
    $('menu-rp').textContent=save.rp;
    $('menu-wins').textContent=save.wins;
  }

  // Menu
  document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{curMode=b.dataset.mode;startGame()}));
  $('btn-shop').addEventListener('click',()=>{renderShop();show('shop-screen')});
  $('btn-abilities').addEventListener('click',()=>{renderAbilities();show('abilities-screen')});
  $('btn-shop-back').addEventListener('click',()=>{refreshMenu();show('menu-screen')});
  $('btn-ab-back').addEventListener('click',()=>{refreshMenu();show('menu-screen')});
  $('btn-quit-game').addEventListener('click',()=>{if(game){game.destroy();game=null}refreshMenu();show('menu-screen')});
  $('btn-again').addEventListener('click',startGame);
  $('btn-go-menu').addEventListener('click',()=>{refreshMenu();show('menu-screen')});

  // Ability button
  $('btn-ability').addEventListener('click',()=>{
    if(!game||game.abilityUsed||!save.ability)return;
    // abilities activate on next shot automatically
  });

  function startGame(){
    show('game-screen');
    $('s1').textContent='0';$('s2').textContent='0';$('timer').textContent='03:00';
    $('turn').textContent='Sua vez';$('turn').style.borderLeft='3px solid var(--red)';
    const abBtn=$('btn-ability');
    if(save.ability){
      const ab=ABILITIES.find(a=>a.id===save.ability);
      abBtn.textContent=ab?`${ab.icon} ${ab.name}`:'⚡ Nenhuma';
      abBtn.disabled=false;abBtn.classList.remove('used');
    } else {abBtn.textContent='⚡ Nenhuma';abBtn.disabled=true}

    if(game)game.destroy();
    game=new Game($('game-canvas'),curMode);
    game.onGoal=(tn,sc)=>{$('s1').textContent=sc[0];$('s2').textContent=sc[1];$('goal-who').textContent=tn===1?'Você!':'Bot!';$('goal-overlay').style.display='flex';setTimeout(()=>$('goal-overlay').style.display='none',1800)};
    game.onTime=tl=>{const m=Math.floor(tl/60),s=Math.floor(tl%60);$('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`};
    game.onTurn=tn=>{
      $('turn').textContent=tn===1?'Sua vez':'Vez do Bot';
      $('turn').style.borderLeft=`3px solid ${tn===1?'var(--red)':'var(--blue)'}`;
      if(game.abilityUsed){$('btn-ability').classList.add('used')}
    };
    game.onEnd=sc=>{
      const won=sc[0]>sc[1];
      const coinsEarned=won?30+Math.floor(Math.random()*20):5+Math.floor(Math.random()*5);
      const rpEarned=won?25+Math.floor(Math.random()*15):-10;
      save.coins+=coinsEarned;
      save.rp=Math.max(0,save.rp+rpEarned);
      if(won)save.wins++;else save.losses++;
      persist();
      $('go-title').textContent=won?'Vitória!':sc[0]===sc[1]?'Empate!':'Derrota!';
      $('go-score').textContent=`${sc[0]} - ${sc[1]}`;
      $('go-coins').textContent=`+${coinsEarned}`;$('go-coins').style.color='var(--gold)';
      $('go-rp').textContent=rpEarned>=0?`+${rpEarned}`:`${rpEarned}`;$('go-rp').style.color=rpEarned>=0?'var(--green)':'var(--red)';
      show('go-screen');
    };

    const origDraw=game.draw.bind(game);
    game.draw=function(){origDraw();const pb=$('power-bar'),pf=$('power-fill');if(this.state==='aiming'){pb.style.display='flex';pf.style.width=`${this.power*100}%`}else{pb.style.display='none'}};
    game.start();
  }

  // SHOP
  function renderShop(){
    $('shop-coins').textContent=save.coins;
    const cont=$('shop-content');cont.innerHTML='';
    const sec=document.createElement('div');sec.className='shop-section';
    sec.innerHTML='<h3>Skins de Botão</h3>';
    const grid=document.createElement('div');grid.className='shop-grid';
    for(const skin of SKINS){
      const item=document.createElement('div');item.className='shop-item';
      const owned=save.ownedSkins.includes(skin.id);
      const equipped=save.skin===skin.id;
      if(owned)item.classList.add('owned');
      if(equipped)item.classList.add('equipped');
      item.innerHTML=`<div class="skin-preview" style="background:radial-gradient(circle at 35% 35%,${skin.c1},${dk(skin.c1,50)});border-color:${skin.c2}"></div><div class="item-name">${skin.name}</div><div class="item-price">${owned?(equipped?'✓ Equipada':'Equipar'):`💰 ${skin.price}`}</div>`;
      item.addEventListener('click',()=>{
        if(equipped)return;
        if(owned){save.skin=skin.id;persist();renderShop();return}
        if(save.coins>=skin.price){save.coins-=skin.price;save.ownedSkins.push(skin.id);save.skin=skin.id;persist();renderShop()}
      });
      grid.appendChild(item);
    }
    sec.appendChild(grid);cont.appendChild(sec);
  }

  function dk(hex,amt){let co=hex.replace('#','');if(co.length===3)co=co[0]+co[0]+co[1]+co[1]+co[2]+co[2];return`rgb(${Math.max(0,parseInt(co.substr(0,2),16)-amt)},${Math.max(0,parseInt(co.substr(2,2),16)-amt)},${Math.max(0,parseInt(co.substr(4,2),16)-amt)})`}

  // ABILITIES
  function renderAbilities(){
    const list=$('ability-list');list.innerHTML='';
    for(const ab of ABILITIES){
      const unlocked=save.rp>=ab.rpReq;
      const active=save.ability===ab.id;
      const card=document.createElement('div');card.className=`ability-card ${unlocked?'unlocked':'locked'} ${active?'active':''}`;
      const reqRank=getRank(ab.rpReq);
      card.innerHTML=`<div class="ab-icon">${ab.icon}</div><div class="ab-info"><div class="ab-name">${ab.name}</div><div class="ab-desc">${ab.desc}</div>${!unlocked?`<div class="ab-req">Requer ${ab.rpReq} RP (${reqRank.name})</div>`:''}</div>`;
      if(unlocked){
        const btn=document.createElement('button');
        btn.className=`ab-equip ${active?'active-ab':''}`;
        btn.textContent=active?'Ativa':'Equipar';
        btn.addEventListener('click',()=>{
          if(active){save.ability=null}else{save.ability=ab.id}
          persist();renderAbilities();
        });
        card.appendChild(btn);
      }
      list.appendChild(card);
    }
  }

  refreshMenu();
})();
</script>
</body>
</html>
